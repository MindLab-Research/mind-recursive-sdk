[project]
name = "mind-recursive"
version = "0.1.1"
description = "Python SDK for the Mind Recursive platform: custom training loops, managed training, deployment and inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Mind Lab" },
]
keywords = ["mindlab", "mind-recursive", "mint", "tinker", "reinforcement-learning", "lora", "ml", "training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # HTTP transport. We pin a floor, not a ceiling: httpx is the only hard
    # runtime dependency of the data plane.
    "httpx>=0.27",
    # forward_backward is protobuf-only on the wire (no JSON branch upstream),
    # so numpy is required to pack tensors, not an optional extra.
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://macaron.im/mindlab"
Repository = "https://github.com/MindLab-Research/mind-recursive-sdk"

[project.optional-dependencies]
# zstd compression of forward_backward bodies, enabled only when the server's
# client/config returns proto_compress_fwdbwd=true.
zstd = ["zstandard>=0.22"]
# Running the recipes in recipes/. Rendering messages -> tokens + loss mask is
# NOT an SDK concern (it depends on the model's chat template and on dataset
# policy), so this is a recipe extra, not a feature of the library.
# jinja2 is not a transformers dependency but apply_chat_template needs it.
recipes = ["transformers>=4.40", "jinja2>=3.1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "transformers>=4.40",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mind_recursive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_tokenizer: needs a real HF tokenizer from the local cache",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "protobuf>=7.36.2",
]
